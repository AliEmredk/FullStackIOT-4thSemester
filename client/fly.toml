# fly.toml app configuration file generated for fullstackiot-web on 2026-03-08T16:13:59+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fullstackiot-web'
primary_region = 'arn'

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "https://fullstackiot-server.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
