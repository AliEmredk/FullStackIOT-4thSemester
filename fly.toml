# fly.toml app configuration file generated for fullstackiot-server on 2026-03-08T13:54:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
  
app = 'fullstackiot-server'
primary_region = 'arn'

[build]
  dockerfile = "server/api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
